canvas: 수면에서 늘어나 분리된 뒤 천천히 떠다니다가 녹음이 끝나면 터지는 반투명 물방울. 터진 작은 물방울들은 후처리가 끝날 때까지 고리를 이뤄 시계방향으로 돕니다. 뒤 화면이 물방울 너머로 휘어 보입니다. 누를 때마다 터뜨리기, 처리 끝, 다시 보기 순서로 넘어갑니다.
