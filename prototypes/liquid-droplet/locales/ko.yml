sample_title: 받아쓰기 메모
sample_text: 오른쪽 Ctrl을 누르고 말하면 술술이 목소리를 글로 바꿔 커서 자리에 넣어 줍니다. 한 번 더 누르면 녹음을 멈추고, 받아쓴 글은 클립보드에도 담깁니다. 물방울은 마이크가 켜져 있는 동안 화면 아래에 떠 있고, 뒤에 있는 창은 물방울 너머로 비쳐 보입니다. 이 글은 뒤 화면이 물방울을 지나며 어떻게 휘어 보이는지 살펴보려고 넣은 예시입니다.
unsupported: 이 미리보기에는 WebGL 2를 지원하는 그래픽 환경이 필요합니다.
