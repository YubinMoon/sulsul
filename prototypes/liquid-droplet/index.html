<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="preview.css">
  <script type="module" src="preview.js"></script>
</head>
<body>
  <main>
    <canvas id="water" tabindex="0"></canvas>
    <header>
      <div class="heading"><span data-i18n="title"></span><span data-i18n="subtitle"></span></div>
      <div class="controls">
        <button id="replay" data-i18n="replay"></button>
        <label class="slow"><input id="slow" type="checkbox"><span data-i18n="slow"></span></label>
        <button id="background" data-i18n="background"></button>
      </div>
    </header>
    <div class="timeline">
      <input id="time" type="range" min="0" max="1.3" step="0.001" value="0">
      <output id="clock">0.00</output>
    </div>
    <p id="error" hidden></p>
  </main>
</body>
</html>
