<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="preview.css">
  <script type="module" src="preview.js"></script>
</head>
<body>
  <main>
    <canvas id="backdrop"></canvas>
    <canvas id="lens"></canvas>
    <canvas id="water" tabindex="0"></canvas>
    <header>
      <div class="heading"><span data-i18n="title"></span><span data-i18n="subtitle"></span></div>
      <div class="panel">
        <div class="controls">
          <button id="replay" data-i18n="replay"></button>
          <label class="toggle"><input id="slow" type="checkbox"><span data-i18n="slow"></span></label>
          <label class="toggle"><input id="sample" type="checkbox" checked><span data-i18n="sample"></span></label>
          <label class="toggle"><input id="lens-on" type="checkbox" checked><span data-i18n="lens"></span></label>
          <div class="backgrounds" role="group">
            <button data-background="0" data-i18n="black" aria-pressed="true"></button>
            <button data-background="1" data-i18n="dark_gray" aria-pressed="false"></button>
            <button data-background="2" data-i18n="light_gray" aria-pressed="false"></button>
            <button data-background="3" data-i18n="white" aria-pressed="false"></button>
          </div>
        </div>
        <div class="timeline">
          <input id="time" type="range" min="0" max="1.3" step="0.001" value="0">
          <output id="clock">0.00</output>
        </div>
      </div>
    </header>
    <p id="error" hidden></p>
  </main>
</body>
</html>
