# cargo-about 설정. installer\build.ps1이 Rust 의존성의 라이선스 고지(THIRD-PARTY-NOTICES.txt)를 만들 때 씁니다.
# 허용하지 않은 라이선스를 쓰는 크레이트가 생기면 고지를 만들지 못하고 멈추니, 라이선스를 확인한 뒤 여기에 더하세요.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    # webpki-roots (Mozilla CA 인증서 목록)
    "CDLA-Permissive-2.0",
    # option-ext (directories가 씀). 고치지 않고 쓰며, 고지에 소스 저장소 주소가 함께 실립니다.
    "MPL-2.0",
    # epaint_default_fonts (egui 기본 글꼴)
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
