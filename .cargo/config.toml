# 빌드한 컴퓨터가 아닌 다른 컴퓨터에서도 실행 파일이 돌도록 하는 설정입니다.

[env]
# whisper.cpp(ggml)는 기본값(ON)이면 빌드하는 컴퓨터의 CPU가 지원하는 명령어에 맞춰
# 빌드합니다. OFF로 두면 어디서 빌드하든 같은 기준(AVX2, FMA, F16C)으로 빌드합니다.
# whisper-rs-sys의 빌드 스크립트가 GGML_로 시작하는 환경 변수를 CMake에 그대로 넘깁니다.
# 이 값을 바꾼 뒤에는 `cargo clean -p whisper-rs-sys`로 다시 빌드해야 적용됩니다.
GGML_NATIVE = "OFF"
# Vulkan 셰이더 생성기를 빌드하는 경로를 짧게 합니다 (`whisper-short-paths.cmake` 참고).
# whisper-rs-sys가 CMAKE_로 시작하는 환경 변수도 CMake에 그대로 넘깁니다.
CMAKE_PROJECT_INCLUDE = { value = ".cargo/whisper-short-paths.cmake", relative = true }

[build]
jobs = 6