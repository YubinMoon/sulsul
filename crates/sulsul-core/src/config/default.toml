# 술술(sulsul) 설정 파일
#
# 이 파일이 설정의 기준입니다. 앱의 설정 화면에서 바꾼 값도 이 파일에 저장되고,
# 앱이 실행 중일 때 이 파일을 직접 고치면 자동으로 다시 불러옵니다.

# 설정 파일 형식 버전 (직접 바꾸지 마세요)
config_version = 1

[general]
ui_language = "ko"
theme = "dark"
launch_at_startup = false

[hotkey]
# 녹음 단축키. 단일 키("RightCtrl") 또는 조합("Ctrl+Shift+Space")
key = "RightCtrl"
# toggle: 한 번 눌러 시작하고 다시 눌러 끝내기
# push_to_talk: 누르고 있는 동안만 녹음
mode = "toggle"

[audio]
input_device = ""
# 녹음이 끝나면 작은 말소리를 알맞은 크기로 키운 뒤 받아씁니다 (소음만 있으면 키우지 않음)
auto_gain = true
# 녹음 앞뒤의 말소리가 없는 부분을 잘라 낸 뒤 받아씁니다 (Silero VAD). 말소리가 없으면 받아쓰지 않고 클립보드도 그대로 둡니다
trim_silence = true
max_record_seconds = 120
feedback_sounds = true

[stt]
engine = "whisper_local"
initial_prompt = ""
api_profile = ""

[postprocess]
enabled = false
processor = ""
api_profile = ""
prompt = "default"

[[postprocess.prompts]]
id = "default"
name = "기본 다듬기"
text = """
음성 인식으로 받아쓴 글을 다듬어 주세요.
- 맞춤법, 띄어쓰기, 문장 부호만 바로잡습니다.
- 뜻과 말투는 바꾸지 않고, 내용을 더하거나 빼지 않습니다.
- 설명 없이 다듬은 글만 돌려줍니다."""
