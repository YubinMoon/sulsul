# 술술(sulsul) 설정 파일
#
# 이 파일이 설정의 기준입니다. 앱의 설정 화면에서 바꾼 값도 이 파일에 저장되고,
# 앱이 실행 중일 때 이 파일을 직접 고치면 자동으로 다시 불러옵니다.

# 설정 파일 형식 버전 (직접 바꾸지 마세요)
config_version = 1

[general]
# 화면 언어
ui_language = "ko"
# 화면 테마: dark, light, system
theme = "dark"
# 로그인할 때 자동 실행
launch_at_startup = false
# 시작할 때 창을 띄우지 않고 트레이에서만 실행
start_minimized = false

[hotkey]
# 녹음 단축키. 단일 키("RightCtrl") 또는 조합("Ctrl+Shift+Space")
key = "RightCtrl"
# toggle: 한 번 눌러 시작하고 다시 눌러 끝내기
# push_to_talk: 누르고 있는 동안만 녹음
mode = "toggle"

[audio]
# 입력 장치 이름. 비워 두면 시스템 기본 장치를 씁니다.
input_device = ""
# 최대 녹음 길이(초). 넘으면 녹음을 자동으로 끝냅니다. (1 ~ 3600)
max_record_seconds = 120
# 녹음 시작·종료 효과음
feedback_sounds = true

[stt]
# 음성 인식 엔진 ID. 엔진별 설정은 [stt.engines.<엔진 ID>]에 있습니다.
engine = "whisper_local"
# 인식 언어: ko, en, auto(자동 감지)
language = "ko"
# 자주 쓰는 용어나 고유명사를 적어 두면 인식 정확도가 올라갑니다.
initial_prompt = ""

[output]
# paste: 커서 위치에 붙여넣기
# type: 키 입력으로 한 글자씩 입력
# clipboard: 클립보드에 복사만
mode = "paste"
# 붙여넣은 뒤 원래 클립보드 내용을 되돌리기
restore_clipboard = true
# 클립보드를 되돌리기 전에 기다리는 시간(ms). 붙여넣기가 가끔 이전 내용으로 되면 늘리세요. (0 ~ 5000)
restore_delay_ms = 150

[postprocess]
# 인식 결과 후처리 (LLM 다듬기 등, 준비 중)
enabled = false
processor = ""
