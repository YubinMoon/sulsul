[package]
name = "sulsul-stt-whisper-onnx"
description = "술술 로컬 Whisper(ONNX) 음성 인식 엔진"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
sulsul-core.workspace = true
# ONNX Runtime 환경(프로세스당 하나)과 DirectML 장치 감지를 SenseVoice 엔진과 함께 씁니다.
sulsul-stt-sensevoice.workspace = true
tracing.workspace = true
ort.workspace = true
rustfft.workspace = true

# Windows 빌드는 기능 플래그 없이 항상 DirectML(GPU) 가속을 넣습니다.
# 장치가 없으면 실행 중에 감지해 CPU로 실행합니다(src/accel.rs).
# DirectML.dll은 ort 기본 기능 copy-dylibs가 실행 파일 옆에 놓으므로 System32의 구버전보다 먼저 로드됩니다.
[target.'cfg(windows)'.dependencies]
ort = { workspace = true, features = ["directml"] }

[dev-dependencies]
tempfile = "3"
tracing-subscriber.workspace = true

[lints]
workspace = true
