[package]
name = "sulsul-app"
description = "술술 데스크톱 앱 (GUI)"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "sulsul"
path = "src/main.rs"

[features]
# Whisper GPU 가속. 기본은 Vulkan이고, 빌드할 때 Vulkan SDK(`VULKAN_SDK`)가 필요합니다.
# 실행 중에 쓸 수 있는 GPU가 없으면 CPU로 인식합니다.
# - CPU 전용: cargo build -p sulsul-app --no-default-features
# - CUDA만: cargo build -p sulsul-app --no-default-features --features cuda
default = ["vulkan"]
cuda = ["sulsul-stt-whisper/cuda"]
vulkan = ["sulsul-stt-whisper/vulkan"]

[dependencies]
sulsul-core.workspace = true
sulsul-stt-whisper.workspace = true
sulsul-stt-whisper-onnx.workspace = true
sulsul-stt-sensevoice.workspace = true
sulsul-stt-cloud.workspace = true
sulsul-llm.workspace = true
sulsul-vad.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe.workspace = true
egui.workspace = true
rust-i18n.workspace = true
rfd.workspace = true
opener.workspace = true
lucide-icons.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dependencies]
winit.workspace = true
raw-window-handle.workspace = true
tray-icon.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
