[package]
name = "sulsul-cli"
description = "술술 개발용 명령줄 도구 (장치 확인, 녹음 테스트)"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# GPU 가속 빌드: cargo build -p sulsul-cli --features cuda
cuda = ["sulsul-stt-whisper/cuda"]
vulkan = ["sulsul-stt-whisper/vulkan"]

[dependencies]
sulsul-core.workspace = true
sulsul-stt-whisper.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
