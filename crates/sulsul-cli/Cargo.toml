[package]
name = "sulsul-cli"
description = "술술 개발용 명령줄 도구 (장치 확인, 녹음 테스트)"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Whisper GPU 가속. 기본은 Vulkan이고, 빌드할 때 Vulkan SDK(`VULKAN_SDK`)가 필요합니다.
# 실행 중에 쓸 수 있는 GPU가 없으면 CPU로 인식합니다.
# - CPU 전용: cargo build -p sulsul-cli --no-default-features
# - CUDA만: cargo build -p sulsul-cli --no-default-features --features cuda
default = ["vulkan"]
cuda = ["sulsul-stt-whisper/cuda"]
vulkan = ["sulsul-stt-whisper/vulkan"]

[dependencies]
sulsul-core.workspace = true
sulsul-stt-whisper.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
