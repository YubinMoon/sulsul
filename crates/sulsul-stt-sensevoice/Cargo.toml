[package]
name = "sulsul-stt-sensevoice"
description = "술술 로컬 SenseVoice(ONNX) 음성 인식 엔진"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
sulsul-core.workspace = true
tracing.workspace = true
ort.workspace = true
ndarray.workspace = true
rustfft.workspace = true

# Windows 빌드는 기능 플래그 없이 항상 DirectML(GPU·NPU) 가속을 넣습니다.
# 장치가 없으면 실행 중에 감지해 CPU로 실행합니다(src/accel.rs).
# DirectML.dll은 ort 기본 기능 copy-dylibs가 실행 파일 옆에 놓으므로 System32의 구버전보다 먼저 로드됩니다.
[target.'cfg(windows)'.dependencies]
ort = { workspace = true, features = ["directml"] }
windows = { version = "0.62", features = [
    "Win32_Graphics_DXCore",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
