[package]
name = "sulsul-stt-whisper"
description = "술술 로컬 Whisper(whisper.cpp) 음성 인식 엔진"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[features]
# 라이브러리 자체의 기본은 CPU 전용입니다. GPU 백엔드는 실행 파일(sulsul-app, sulsul-cli)이
# 기본 기능으로 켭니다. 여기서 켜 두면 실행 파일의 `--no-default-features`로 끌 수 없습니다.
default = []
# GPU 가속 백엔드 (빌드할 때 고릅니다. 실행 중에 쓸 수 있는 GPU가 없으면 CPU로 인식합니다)
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
sulsul-core.workspace = true
tracing.workspace = true
whisper-rs = { workspace = true, features = ["tracing_backend", "raw-api"] }

[lints]
workspace = true
