[package]
name = "sulsul-stt-whisper"
description = "술술 로컬 Whisper(whisper.cpp) 음성 인식 엔진"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = []
# GPU 가속 (빌드할 때만 고릅니다. 기본은 어디서나 도는 CPU 빌드)
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
sulsul-core.workspace = true
tracing.workspace = true
whisper-rs = { workspace = true, features = ["tracing_backend", "raw-api"] }

[lints]
workspace = true
