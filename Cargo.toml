[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/YubinMoon/sulsul"

[workspace.dependencies]
# 내부 크레이트
sulsul-core = { path = "crates/sulsul-core" }
sulsul-stt-whisper = { path = "crates/sulsul-stt-whisper" }
sulsul-stt-sensevoice = { path = "crates/sulsul-stt-sensevoice" }
sulsul-stt-whisper-onnx = { path = "crates/sulsul-stt-whisper-onnx" }
sulsul-stt-cloud = { path = "crates/sulsul-stt-cloud" }
sulsul-llm = { path = "crates/sulsul-llm" }

# 공통
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 설정
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
serde_ignored = "0.1"
directories = "6"
notify-debouncer-mini = "0.7"

# 오디오
cpal = "0.18"
rubato = "5"
hound = "3"

# 음성 인식
whisper-rs = "0.16"
ort = "2.0.0-rc.15"
ndarray = "0.17"
rustfft = "6"

# 모델 내려받기
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"

# 명령줄
clap = { version = "4", features = ["derive"] }

# GUI
eframe = "0.37"
egui = "0.37"
winit = { version = "0.30", default-features = false }
rust-i18n = "4"
rfd = "0.18"
opener = "0.9"
lucide-icons = "1"

# 데스크톱 연동 (전역 단축키·클립보드·트레이·자동 실행, Windows)
windows-sys = "0.61"
tray-icon = { version = "0.26", default-features = false }
raw-window-handle = "0.6"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
# 의존성은 최적화해서 빌드 (오디오 처리·추론 속도 확보)
opt-level = 2
