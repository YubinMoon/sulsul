  build_debug: 개발 빌드
  build_release: 릴리스 빌드
  paths:
    title: 파일 위치
    config: 설정 파일
    data: 데이터
    models: 모델
    recordings: 녹음
    open: "%{name} 열기"
  engines:
    title: 음성 인식 엔진
    local: 로컬
