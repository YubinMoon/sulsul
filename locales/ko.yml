# 한국어 번역 (기본 언어)
#
# 규칙
# - 화면에 보이는 모든 문구는 코드에 직접 쓰지 않고 이 파일의 키로 참조합니다.
# - 새 언어는 이 파일을 복사해 `<언어 코드>.yml`(예: en.yml)로 만들고 값만 번역합니다.
# - 엔진·후처리기 문구는 `engine.<엔진 ID>.*`, `processor.<ID>.*` 아래에 둡니다.
#   (코어 크레이트의 설명자에 있는 name_key, label_key 등과 일치해야 합니다)
# - 값 안의 %{이름}은 코드에서 채워 넣는 자리입니다.
_version: 1

app:
  name: 술술
  tagline: 단축키를 누르고 말하면 글로 바꿔 줍니다.
  fatal: "앱을 시작하지 못했습니다.\n\n%{message}"

# 화면 언어 선택 목록에 보이는 이름 (그 언어로 쓴 이름).
# 새 언어 파일을 만들면 모든 언어 파일의 이 목록에 추가합니다.
language:
  ko: 한국어
  en: English

nav:
  record: 녹음
  transcribe: 받아쓰기 테스트
  settings: 설정
  about: 정보

common:
  cancel: 취소
  retry: 다시 시도
  coming_soon: 준비 중
  open_failed: "열지 못했습니다: %{message}"
  wav_files: WAV 오디오

unit:
  seconds: "%{value}초"
  seconds_suffix: " 초"
  milliseconds: "%{value} ms"
  milliseconds_suffix: " ms"
  hertz: "%{value} Hz"
  dbfs: "%{value} dBFS"
  percent: "%{value}%"

# 사이드바 아래쪽의 설정 파일 상태
status:
  synced: 설정 파일과 동기화됨
  saving: 설정 저장 중…
  issues: "확인할 설정 항목 %{count}개"
  save_failed: 설정 저장 실패
  config_broken: 설정 파일 오류

# 설정 파일을 읽거나 쓰지 못할 때 화면 위쪽에 뜨는 배너
config_banner:
  title: 설정 파일을 읽을 수 없습니다
  locked: 마지막으로 정상이던 설정을 그대로 쓰고 있고, 설정 편집은 잠겨 있습니다. 파일을 고쳐서 저장하면 자동으로 다시 읽습니다.
  reload: 파일 다시 읽기
  overwrite: 현재 화면 값으로 덮어쓰기
  overwrite_note_syntax: "'현재 화면 값으로 덮어쓰기'를 누르면 지금 파일을 config.toml.bak으로 백업한 뒤 화면에 보이는 값으로 새로 씁니다."
  overwrite_note_value: "'현재 화면 값으로 덮어쓰기'를 누르면 파일의 주석과 구조는 그대로 두고 값만 화면에 보이는 값으로 바꿉니다. (백업 파일은 만들지 않습니다)"
  overwrite_note_io: "'현재 화면 값으로 덮어쓰기'를 누르면 화면에 보이는 값으로 설정 파일을 새로 씁니다."
  save_failed_title: 설정을 저장하지 못했습니다
  watch_failed_title: 설정 파일이 바뀌는 것을 감지할 수 없습니다
  watch_failed_help: 설정 파일을 직접 고친 뒤에는 '파일 다시 읽기'를 눌러 주세요.

error:
  audio:
    no_input_device: 사용할 수 있는 마이크가 없습니다. 마이크가 연결되어 있고 사용 중지되어 있지 않은지 확인하세요.
    device_not_found: "입력 장치 '%{device}'을(를) 찾을 수 없습니다. 장치가 연결되어 있는지 확인하거나 다른 장치를 선택하세요."
    permission_denied: "마이크를 쓸 권한이 없습니다. %{hint}"
    device_busy: 다른 앱이 마이크를 단독으로 쓰고 있어 열 수 없습니다. 그 앱을 닫고 다시 시도하세요.
    unsupported_format: "이 장치의 오디오 형식(%{format})은 지원하지 않습니다."
    device: "오디오 장치에 문제가 생겼습니다: %{message}"
    stream: "녹음 중에 장치 오류가 발생했습니다. 마이크 연결이 끊겼을 수 있습니다. (%{message})"
    resample: "샘플레이트를 바꾸지 못했습니다: %{message}"
    wav: "WAV 파일을 처리하지 못했습니다 (%{path}): %{message}"
  stt:
    unknown_engine: "'%{engine}' 엔진을 찾을 수 없습니다. 다른 엔진을 선택하세요."
    not_implemented: "%{engine} 엔진은 아직 구현되지 않았습니다. 다음 단계에서 지원할 예정입니다."
    invalid_settings: "%{engine} 엔진 설정에 잘못된 값이 있습니다: %{issues}"
    model_not_found: "모델 파일이 없습니다: %{path}"
    sample_rate_mismatch: "엔진은 %{expected} Hz 오디오를 받는데 %{actual} Hz 오디오가 전달됐습니다."
    unsupported_language: "이 엔진은 '%{language}' 언어를 지원하지 않습니다."
    cancelled: 받아쓰기를 취소했습니다.
    backend: "엔진에서 오류가 발생했습니다: %{message}"
  config:
    read: "설정 파일을 읽지 못했습니다 (%{path}): %{message}"
    write: "설정 파일에 쓰지 못했습니다 (%{path}): %{message}"
    parse_at: "%{line}번째 줄 %{column}번째 칸: %{message}"
    parse_at_line: "%{line}번째 줄: %{message}"
    parse: "%{message}"
    serialize: "설정을 TOML로 바꾸지 못했습니다: %{message}"
    watch: "%{message}"

# 마이크 권한을 확인할 곳 (운영체제별)
hint:
  microphone_settings:
    windows: "Windows 설정 > 개인 정보 및 보안 > 마이크에서 데스크톱 앱의 마이크 접근이 켜져 있는지 확인하세요."
    macos: "시스템 설정 > 개인정보 보호 및 보안 > 마이크에서 이 앱이 허용되어 있는지 확인하세요."
    other: 시스템의 소리 설정에서 입력 장치와 앱 권한을 확인하세요.

# 설정 값 문제 (설정 파일을 읽으며 발견한 것)
issue:
  unknown_key: "%{key}: 알 수 없는 항목입니다 (오타일 수 있습니다)"
  out_of_range: "%{key}: %{min} ~ %{max} 사이여야 합니다"
  empty: "%{key}: 비워 둘 수 없습니다"
  wrong_type: "%{key}: %{expected} 값이어야 합니다"
  unknown_choice: "%{key}: '%{value}'은(는) 고를 수 없는 값입니다"
  type:
    boolean: 참/거짓(true/false)
    integer: 정수
    string: 문자열

device:
  system_default: 시스템 기본 장치
  default_tag: 기본
  missing: "%{name} (연결되지 않음)"

hotkey:
  # 설정 파일의 키 이름 → 화면에 보일 이름. 여기 없는 키는 설정 값 그대로 보입니다.
  keys:
    RightCtrl: 오른쪽 Ctrl
    RightAlt: 오른쪽 Alt
    RightShift: 오른쪽 Shift
    ScrollLock: Scroll Lock
    Pause: Pause/Break
  mode:
    toggle: 토글
    push_to_talk: 누르는 동안

stt:
  engine:
    label: 엔진
    unknown: "'%{id}' 엔진은 이 앱에 등록되어 있지 않습니다. 다른 엔진을 선택하세요."
  language:
    label: 인식 언어
    ko: 한국어
    en: 영어
    auto: 자동 감지

record:
  title: 녹음
  subtitle: 마이크 소리가 제대로 들어오는지 확인합니다.
  start: 녹음 시작
  stop: 녹음 정지
  error_title: 녹음하지 못했습니다
  empty_title: 녹음된 소리가 없습니다
  empty_body: 장치에서 오디오를 받지 못했습니다. 조금 더 길게 녹음하거나 다른 입력 장치를 골라 보세요.
  hotkey_hint: "단축키: %{key} · %{mode}"
  hotkey_not_connected: 전역 단축키는 아직 연결되지 않았습니다
  device:
    title: 입력 장치
    refresh: 장치 목록 새로 고침
    format: "%{rate} · %{channels}채널"
    format_unknown: 형식을 알 수 없음
    using_default: "지금 기본 장치: %{name} (%{format})"
    none: 입력 장치를 찾지 못했습니다. 마이크를 연결한 뒤 새로 고침을 눌러 주세요.
    not_connected: 설정에 저장된 장치가 지금은 연결되어 있지 않습니다.
  recorder:
    title: 녹음 테스트
    idle: 녹음 대기 중
    recording: 녹음 중
    limit: "최대 %{max}까지 녹음합니다"
    limit_with_device: "최대 %{max} · %{device}"
    level_idle: 녹음을 시작하면 입력 음량이 여기에 표시됩니다. (dBFS)
    level_readout: "입력 음량 %{level} · 최근 최댓값 %{peak}"
  result:
    title: 방금 녹음한 오디오
    duration: 길이
    sample_rate: 샘플레이트
    peak: 최대 음량
    rms: 평균 음량 (RMS)
    device: "녹음 장치: %{device}"
    auto_stopped: 최대 녹음 길이에 닿아 자동으로 멈췄습니다.
    silent_title: 소리가 거의 들어오지 않았습니다
    silent_body: "마이크가 음소거되어 있지 않은지, 올바른 입력 장치를 골랐는지 확인하세요. %{hint}"
    save_wav: WAV로 저장
    save_dialog_title: 녹음을 WAV 파일로 저장
    saved: "저장했습니다: %{path}"
    open_folder: 녹음 폴더 열기
    to_transcribe: 받아쓰기 테스트로

transcribe:
  title: 받아쓰기 테스트
  subtitle: 녹음한 오디오나 WAV 파일을 음성 인식 엔진에 넣어 결과와 속도를 확인합니다.
  follow_settings: "설정 값 사용 (%{value})"
  temporary_help: 여기서 바꾼 엔진과 언어는 이 화면에서만 쓰이고 설정 파일에는 저장되지 않습니다.
  run: 받아쓰기
  running: "인식 중… %{elapsed}"
  need_audio: 먼저 받아쓰기할 오디오를 준비하세요.
  source:
    title: 오디오
    recording: 방금 녹음한 오디오
    file: WAV 파일
    summary: "길이 %{duration} · %{rate}"
    no_recording: 아직 녹음한 오디오가 없습니다.
    go_record: 녹음 화면으로
    open_wav: WAV 파일 열기
    open_dialog_title: 받아쓰기할 WAV 파일 선택
    no_file: 선택한 파일이 없습니다.
    empty_file: 이 WAV 파일에는 오디오가 들어 있지 않습니다.
  engine:
    title: 엔진
  model:
    label: 모델 파일
    found: 있음
    missing: 없음
    unknown: 모델 파일 위치를 알 수 없습니다
    open_folder: 모델 폴더 열기
    download: 모델 내려받기
  result:
    title: 결과
    empty: (인식된 내용이 없습니다)
    copy: 복사
    copied: 결과를 클립보드에 복사했습니다.
    detected: "감지된 언어 %{language}"
    audio: 오디오 길이
    prepare: 엔진 준비 시간
    reused: 다시 사용
    reused_note: 앞에서 준비한 엔진
    recognize: 인식 시간
    rtf: RTF
    rtf_note: 인식 시간 ÷ 오디오 길이
    failed: 받아쓰기하지 못했습니다
  history:
    title: 시도 기록
    help: 이번 실행 동안의 기록입니다. 번호를 누르면 그 결과를 다시 볼 수 있습니다.
    number: 번호
