# 한국어 번역 (기본 언어)
#
# 규칙
# - 화면에 보이는 모든 문구는 코드에 직접 쓰지 않고 이 파일의 키로 참조합니다.
# - 새 언어는 이 파일을 복사해 `<언어 코드>.yml`(예: en.yml)로 만들고 값만 번역합니다.
# - 엔진·후처리기 문구는 `engine.<엔진 ID>.*`, `processor.<ID>.*` 아래에 둡니다.
#   (코어 크레이트의 설명자에 있는 name_key, label_key 등과 일치해야 합니다)
# - 값 안의 %{이름}은 코드에서 채워 넣는 자리입니다.
# - 알림과 설명은 꼭 필요한 것만 한 줄로 씁니다. 오류의 자세한 원인은 로그에 남깁니다.
_version: 1

app:
  name: 술술
  tagline: 단축키를 누르고 말하면 글로 바꿔 줍니다.
  fatal: "앱을 시작하지 못했습니다.\n\n%{message}"

# 화면 언어 선택 목록에 보이는 이름 (그 언어로 쓴 이름).
# 새 언어 파일을 만들면 모든 언어 파일의 이 목록에 추가합니다.
language:
  ko: 한국어
  en: English

nav:
  test: 테스트
  history: 기록
  models: 모델 관리
  prompts: 프롬프트
  settings: 설정
  about: 정보

common:
  cancel: 취소
  retry: 다시 시도
  expand: 펼치기
  collapse: 접기
  copied: 복사했습니다.
  open_failed: 열지 못했습니다.
  wav_files: WAV 오디오

unit:
  seconds: "%{value}초"
  seconds_suffix: " 초"
  milliseconds: "%{value} ms"
  hertz: "%{value} Hz"
  dbfs: "%{value} dBFS"
  percent: "%{value}%"

# 사이드바 아래쪽의 설정 파일 상태
status:
  synced: 설정 저장됨
  saving: 설정 저장 중…
  issues: "확인할 설정 %{count}개"
  save_failed: 설정 저장 실패
  config_broken: 설정 파일 오류

# 설정 파일을 읽거나 쓰지 못할 때 화면 위쪽에 뜨는 배너
config_banner:
  title: 설정 파일을 읽을 수 없습니다
  locked: 파일을 고치면 자동으로 다시 읽습니다. 그때까지 설정을 바꿀 수 없습니다.
  reload: 파일 다시 읽기
  overwrite: 화면 값으로 덮어쓰기
  overwrite_note_syntax: 덮어쓰면 지금 파일은 config.toml.bak으로 백업합니다.
  save_failed_title: 설정을 저장하지 못했습니다
  watch_failed_help: 파일을 직접 고친 뒤에는 '파일 다시 읽기'를 누르세요.

# 오류 원인. 무엇이 안 됐는지와 할 일만 짧게 씁니다 (원문은 로그에 남음).
error:
  # 모델 파일이 없음 (받아쓰기·글 다듬기 공통)
  model_missing: 모델 파일이 없습니다. 모델 관리에서 내려받으세요.
  audio:
    no_input_device: 마이크를 찾지 못했습니다. 연결을 확인하세요.
    device_not_found: "'%{device}' 장치가 연결되어 있지 않습니다."
    permission_denied: "마이크 권한이 없습니다. %{hint}"
    device_busy: 다른 앱이 마이크를 쓰고 있습니다.
    unsupported_format: 이 장치의 오디오 형식은 쓸 수 없습니다.
    device: 오디오 장치에 문제가 생겼습니다.
    stream: 녹음 중에 마이크 연결이 끊겼습니다.
    resample: 오디오를 변환하지 못했습니다.
    wav: WAV 파일을 처리하지 못했습니다.
  stt:
    unknown_engine: "'%{engine}' 엔진은 이 앱에 없습니다. 다른 엔진을 고르세요."
    not_implemented: "%{engine} 엔진은 아직 쓸 수 없습니다."
    invalid_settings: "%{engine} 설정에 잘못된 값이 있습니다: %{issues}"
    sample_rate_mismatch: 오디오 형식이 엔진과 맞지 않습니다.
    unsupported_language: "이 엔진에서 쓸 수 없는 언어입니다 (%{language})."
    cancelled: 취소했습니다.
    backend: 인식 엔진에서 오류가 났습니다.
  download:
    cancelled: 취소했습니다.
    http: "서버 오류입니다 (HTTP %{status})."
    network: 인터넷 연결을 확인하세요.
    io: 파일을 저장하지 못했습니다. 저장 공간을 확인하세요.
    corrupt: 받은 파일이 손상됐습니다. 다시 받으세요.
  # 글 다듬기 제공자에 요청을 보내다 난 오류
  llm:
    invalid_endpoint: 주소가 올바르지 않습니다.
    missing_api_key: API 키가 필요합니다.
    auth: API 키가 맞지 않습니다.
    not_found: 주소나 모델 이름을 확인하세요.
    rate_limited: 요청 한도를 넘었습니다. 잠시 뒤 다시 하세요.
    http: "제공자 오류입니다 (HTTP %{status})."
    network: 제공자에 연결하지 못했습니다.
    bad_response: 제공자의 응답을 읽지 못했습니다.
    cancelled: 취소했습니다.
  # 글 다듬기에 실패한 이유 (외부 제공자 오류는 위의 llm.*을 씀)
  refine:
    no_prompts: 프롬프트가 없습니다. 프롬프트 화면에서 추가하세요.
    missing_prompt: 고른 프롬프트가 없습니다. 프롬프트 화면에서 고르세요.
    empty_prompt: "'%{name}' 프롬프트의 지시문이 비어 있습니다."
    empty_output: 모델이 빈 글을 돌려주었습니다.
    runner_missing: 로컬 모델 실행기(sulsul-llm-runner)를 찾지 못했습니다.
    runner_failed: 로컬 모델을 실행하다 오류가 났습니다.
    runner_timeout: "로컬 모델이 %{seconds}초 안에 답하지 않았습니다."
    model_load: 모델을 불러오지 못했습니다.
    prompt_too_long: 글이 너무 길어 모델이 처리하지 못합니다.
  config:
    read: 파일을 열 수 없습니다. 권한을 확인하세요.
    write: 파일에 쓸 수 없습니다. 권한을 확인하세요.
    parse_at: "%{line}번째 줄 %{column}번째 칸이 잘못됐습니다."
    parse_at_line: "%{line}번째 줄이 잘못됐습니다."
    parse: 파일 형식이 잘못됐습니다.
    serialize: 설정을 파일 형식으로 바꾸지 못했습니다.
    watch: 설정 파일이 바뀌는 것을 감지할 수 없습니다

# 마이크 권한을 확인할 곳 (운영체제별)
hint:
  microphone_settings:
    windows: Windows 설정 > 개인 정보 및 보안 > 마이크에서 허용하세요.
    macos: 시스템 설정 > 개인정보 보호 및 보안 > 마이크에서 허용하세요.
    other: 시스템 설정에서 마이크 권한을 확인하세요.

# 설정 값 문제 (설정 파일을 읽으며 발견한 것)
issue:
  unknown_key: "%{key}: 알 수 없는 항목입니다"
  out_of_range: "%{key}: %{min} ~ %{max} 사이여야 합니다"
  empty: "%{key}: 비워 둘 수 없습니다"
  wrong_type: "%{key}: %{expected} 값이어야 합니다"
  unknown_choice: "%{key}: '%{value}'은(는) 고를 수 없습니다"
  type:
    boolean: 참/거짓(true/false)
    integer: 정수
    string: 문자열

device:
  system_default: 시스템 기본 장치
  default_tag: 기본
  missing: "%{name} (연결되지 않음)"
  refresh: 장치 목록 새로 고침
  format: "%{rate} · %{channels}채널"
  format_unknown: 형식을 알 수 없음
  using_default: "지금 기본 장치: %{name} (%{format})"
  none: 마이크를 찾지 못했습니다. 연결한 뒤 새로 고치세요.
  not_connected: 저장된 장치가 연결되어 있지 않습니다.

