# 알림 영역(트레이) 아이콘
tray:
  tooltip: 술술
  tooltip_recording: 술술 · 녹음 중
  tooltip_transcribing: 술술 · 받아쓰는 중
  open: 술술 열기
  quit: 끝내기

# 단축키 받아쓰기 (녹음 → 인식 → 클립보드)
dictation:
  copied: 받아쓴 글을 클립보드에 복사했습니다. 붙여넣으면 원래 클립보드 내용으로 돌아갑니다.
  refined_copied: 받아쓰고 다듬은 글을 클립보드에 복사했습니다. 붙여넣으면 원래 클립보드 내용으로 돌아갑니다.
  refine_failed: "글을 다듬지 못해 받아쓴 글 대신 오류 안내를 클립보드에 넣었습니다: %{message}"
  # 글 다듬기에 실패했을 때 받아쓴 글 대신 클립보드에 넣는 글. 다듬은 결과로 착각하지 않게 첫 줄에서 분명히 밝힙니다.
  refine_failed_clipboard: |-
    [술술 오류] 글 다듬기에 실패했습니다. 이 글은 받아쓰거나 다듬은 결과가 아니라 오류 안내입니다.
    원인: %{message}
    받아쓴 원문은 클립보드에 넣지 않았습니다. 모델 관리 > 글 다듬기에서 모델과 제공자를 확인하거나, 다듬지 않은 글을 받으려면 글 다듬기 '사용'을 끄세요.
  empty: 인식된 말이 없습니다.
  no_speech: 말소리가 들리지 않아 받아쓰지 않았습니다. 마이크가 음소거되어 있지 않은지 확인해 보세요.
  busy: 아직 이전 받아쓰기를 처리하고 있습니다.
  record_failed: "녹음을 시작하지 못했습니다: %{message}"
  failed: "받아쓰지 못했습니다: %{message}"
  clipboard_failed: "클립보드에 복사하지 못했습니다: %{message}"
  hotkey_unavailable: "단축키를 쓸 수 없습니다: %{message}"
  hotkey_unsupported: 이 운영체제에서는 아직 전역 단축키를 지원하지 않습니다.
  invalid_hotkey: "'%{key}'은(는) 단축키로 쓸 수 없는 키입니다. 설정에서 다른 키를 지정하세요."
  # 클립보드에 복사하지 못한 이유 (clipboard_failed의 message 자리)
  clipboard_busy: 다른 앱이 클립보드를 쓰고 있습니다. 잠시 뒤 다시 해 보세요.
  clipboard_unsupported: 이 운영체제에서는 아직 클립보드를 지원하지 않습니다.

# 로그인할 때 자동 실행
autostart:
  failed: "자동 실행 설정을 바꾸지 못했습니다: %{message}"
  unsupported: 이 운영체제에서는 아직 자동 실행을 지원하지 않습니다.
