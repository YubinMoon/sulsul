    language: 언어
    time: 걸린 시간
    rtf: RTF
    result: 결과
  error:
    crashed: 엔진이 결과를 내지 못하고 멈췄습니다. 로그를 확인해 주세요.

settings:
  title: 설정
  subtitle: 바꾼 값은 바로 설정 파일에 저장됩니다.
  file:
    title: 설정 파일
    help: 이 TOML 파일이 설정의 기준입니다. 앱이 켜져 있을 때 파일을 직접 고쳐도 화면에 바로 반영됩니다.
    open: 설정 파일 열기
    open_folder: 폴더 열기
  reset:
    button: 기본값으로 되돌리기
    confirm_title: 모든 설정을 기본값으로 되돌릴까요?
    confirm_body: 화면 언어, 단축키, 엔진 설정을 포함한 모든 값이 처음 상태로 돌아갑니다. 설정 파일의 주석은 그대로 남습니다.
    confirm: 되돌리기
    done: 설정을 기본값으로 되돌렸습니다.
  issues:
    title: "설정 파일에 확인할 항목이 %{count}개 있습니다"
    help: 설정 파일을 열어 확인해 주세요. 알 수 없는 항목은 무시됩니다.
  general:
    title: 일반
    language: 화면 언어
    language_missing: "'%{code}' 번역 파일이 없어 기본 언어로 표시합니다."
    theme: 테마
    theme_dark: 다크
    theme_light: 라이트
    theme_system: 시스템
    launch_at_startup: 로그인할 때 자동 실행
    start_minimized: 시작할 때 트레이로만 실행
    start_minimized_help: 창을 띄우지 않고 트레이 아이콘만 표시합니다.
  hotkey:
    title: 단축키
    key: 녹음 단축키
