engine:
  whisper_local:
    name: Whisper (로컬)
    description: 이 컴퓨터에서 whisper.cpp로 인식합니다. 인터넷 없이 동작하고 음성이 밖으로 나가지 않습니다.
    settings:
      model: 모델
      model_help: 모델 관리 탭에서 용량과 정확도에 맞춰 다양한 Whisper GGML 크기를 설치하고 선택할 수 있습니다.
      model_path: 모델 파일 직접 지정
      model_path_help: 비워 두면 모델 폴더에서 선택한 모델을 찾습니다.
      use_gpu: GPU 가속
      use_gpu_help: 지원되는 그래픽카드가 있으면 훨씬 빠르게 인식합니다. 쓸 수 있는 GPU가 없으면 자동으로 CPU로 인식합니다.
      use_gpu_unavailable: "이 앱은 CPU 전용으로 빌드되어(--no-default-features) GPU 가속을 쓸 수 없습니다. GPU를 쓰려면 기본 기능(Vulkan)을 켜고 다시 빌드하세요 (예: cargo run -p sulsul-app)."
      use_gpu_no_device: 이 컴퓨터에서 쓸 수 있는 GPU를 찾지 못해 CPU로 인식합니다. 그래픽 드라이버가 설치되어 있는지 확인하세요.
      beam_size: 탐색 폭(beam size)
      beam_size_help: 클수록 정확하지만 느립니다. 1이면 가장 빠른 방식(greedy)으로 인식합니다.
    models:
      tiny:
        name: Tiny
        description: 약 78 MB. 매우 가볍고 빠르며 저사양 환경이나 빠른 테스트에 알맞습니다.
      tiny-en:
        name: Tiny (영어 전용)
        description: 약 78 MB. Tiny의 영어 전용 모델로, 영어만 인식하지만 같은 크기의 다국어 모델보다 정확합니다.
      base:
        name: Base
        description: 약 148 MB. 가볍고 빠른 기본 입문형 모델입니다.
      base-en:
        name: Base (영어 전용)
        description: 약 148 MB. Base의 영어 전용 모델로, 영어만 인식하지만 같은 크기의 다국어 모델보다 정확합니다.
      small:
        name: Small
        description: 약 488 MB. 속도와 정확도의 균형이 무난한 중소형 모델입니다.
      small-en:
        name: Small (영어 전용)
        description: 약 488 MB. Small의 영어 전용 모델로, 영어만 인식하며 영어에서는 같은 크기의 다국어 모델보다 조금 더 정확합니다.
      large-v3-turbo-q5_0:
        name: Large V3 Turbo (Q5_0 경량)
        description: 약 574 MB. Large V3 Turbo를 5비트 양자화해 메모리 부담을 줄였습니다.
      medium:
        name: Medium
        description: 약 1.5 GB. 안정적인 정확도를 갖춘 중형 다국어 모델입니다.
      medium-en:
        name: Medium (영어 전용)
        description: 약 1.5 GB. Medium의 영어 전용 모델로, 영어만 인식하며 영어에서는 같은 크기의 다국어 모델과 비슷하거나 조금 더 정확합니다.
      large-v3-turbo:
        name: Large V3 Turbo
        description: 약 1.6 GB. Large V3급 한국어·다국어 정확도를 훨씬 빠르게 제공합니다.
      large-v3:
        name: Large V3 (최고 정확도)
        description: 약 3.1 GB. 가장 높은 인식 정확도를 내지만 용량과 메모리를 많이 씁니다.
    # 모델 내려받기 화면의 단계별 선택지 (크기 → 언어 → 정밀도)
    choices:
      size:
        tiny: Tiny
        base: Base
        small: Small
        medium: Medium
        large-v3-turbo: Large v3 Turbo
        large-v3: Large v3
      language:
        multi: 다국어
        en: 영어 전용
      precision:
        f16: 원본 (F16)
        q5_0: Q5_0 양자화
  whisper_onnx:
    name: Whisper (로컬 ONNX)
    description: 이 컴퓨터에서 ONNX Runtime으로 Whisper 모델을 돌립니다. whisper.cpp를 쓰는 Whisper (로컬)과 달리 GPU 가속에 DirectML을 씁니다. 인터넷 없이 동작하고 음성이 밖으로 나가지 않습니다.
    settings:
      model: 모델
      model_help: 모델 관리 탭에서 크기·언어·정밀도에 맞춰 Whisper ONNX 모델을 설치하고 고를 수 있습니다.
      model_path: 모델 폴더 직접 지정
