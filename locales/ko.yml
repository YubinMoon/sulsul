    name: SenseVoice (로컬 ONNX)
    description: 한국어·영어·중국어·일본어·광둥어에 특화된 초고속 비자기회귀 로컬 엔진입니다.
    settings:
      model: 모델 변형
      model_help: 속도와 메모리 효율이 높은 양자화(int8) 또는 전체 정밀도(fp32) ONNX 모델을 고릅니다.
      model_path: 모델 폴더 직접 지정
      model_path_help: 비워 두면 기본 폴더(models/sense_voice)를 씁니다. model*.onnx와 tokens.txt가 함께 있어야 합니다.
      use_itn: 숫자·문장부호 보정 (ITN)
      use_itn_help: 인식 결과에 역정규화(ITN) 포맷팅을 적용합니다.
      device: 가속 장치
      device_help: DirectML로 NPU나 GPU에서 인식합니다. 고른 장치를 쓸 수 없으면 CPU로 실행하고 원인을 로그에 남깁니다.
      device_auto: 자동 (NPU → GPU → CPU)
      device_npu: NPU
      device_gpu: GPU
      device_cpu: CPU
      device_npu_missing: 이 PC에서 NPU를 찾지 못했습니다.
      device_gpu_missing: 이 PC에서 DirectML을 쓸 수 있는 GPU를 찾지 못했습니다.
      device_not_built: DirectML 가속은 Windows 빌드에서만 쓸 수 있습니다.
    models:
      int8:
        name: SenseVoice Small INT8
        description: 약 240 MB. 8비트 양자화 모델로 매우 빠르고 가벼워 대부분의 환경에 권장합니다.
      fp32:
        name: SenseVoice Small FP32 (고정밀)
        description: 약 938 MB. 양자화 없는 원본 정밀도 모델입니다.
    # 모델 내려받기 화면의 단계별 선택지 (크기 → 언어 → 정밀도)
    choices:
      size:
        small: Small
      language:
        multi: 한·영·중·일·광둥어
      precision:
        int8: INT8 양자화
        fp32: 원본 (FP32)
  cloud_api:
    name: 클라우드 API (OpenAI 호환)
    description: OpenAI, Groq 또는 호환 `/audio/transcriptions` 엔드포인트로 음성을 전송해 인식합니다.
    settings:
      timeout_seconds: 요청 제한 시간(초)
      timeout_seconds_help: HTTP 요청 전체 응답을 기다리는 최대 시간입니다.
    providers:
      openai: OpenAI
      groq: Groq
      custom: 커스텀 (OpenAI 호환)
  mock:
    name: 테스트용 가짜 엔진
    description: 실제 인식 없이 받은 오디오 정보를 돌려줍니다. 개발 중 화면 흐름을 확인할 때 씁니다.
    settings:
      delay_ms: 응답 지연(ms)
      delay_ms_help: 인식에 시간이 걸리는 상황을 흉내 냅니다.
      text: 고정 응답 문구
      text_help: 비워 두면 오디오 길이와 음량을 알려 줍니다.
