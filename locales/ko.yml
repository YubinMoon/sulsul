      use_gpu_unavailable: "이 앱은 CPU 전용으로 빌드되어(--no-default-features) GPU 가속을 쓸 수 없습니다. GPU를 쓰려면 기본 기능(Vulkan)을 켜고 다시 빌드하세요 (예: cargo run -p sulsul-app)."
      use_gpu_no_device: 이 컴퓨터에서 쓸 수 있는 GPU를 찾지 못해 CPU로 인식합니다. 그래픽 드라이버가 설치되어 있는지 확인하세요.
      beam_size: 탐색 폭(beam size)
      beam_size_help: 클수록 정확하지만 느립니다. 1이면 가장 빠른 방식(greedy)으로 인식합니다.
    models:
      tiny:
        name: Tiny
        description: 약 78 MB. 매우 가볍고 빠르며 저사양 환경이나 빠른 테스트에 알맞습니다.
      base:
        name: Base
        description: 약 148 MB. 가볍고 빠른 기본 입문형 모델입니다.
      small:
        name: Small
        description: 약 488 MB. 속도와 정확도의 균형이 무난한 중소형 모델입니다.
      large-v3-turbo-q5_0:
        name: Large V3 Turbo (Q5_0 경량)
        description: 약 574 MB. Large V3 Turbo를 5비트 양자화해 메모리 부담을 줄였습니다.
      medium:
        name: Medium
        description: 약 1.5 GB. 안정적인 정확도를 갖춘 중형 다국어 모델입니다.
      large-v3-turbo:
        name: Large V3 Turbo
        description: 약 1.6 GB. Large V3급 한국어·다국어 정확도를 훨씬 빠르게 제공합니다.
      large-v3:
        name: Large V3 (최고 정확도)
