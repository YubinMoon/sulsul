      size:
        tiny: Tiny
        base: Base
        small: Small
        medium: Medium
        large-v3-turbo: Large v3 Turbo
        large-v3: Large v3
      language:
        multi: 다국어
      precision:
        f16: 원본 (F16)
        q5_0: Q5_0 양자화
