  mode:
    toggle: 토글
    push_to_talk: 누르는 동안
  # 단축키가 비어 있을 때 키 이름 자리에 보이는 글
  unset: 지정 안 됨
  # 단축키 입력란 (눌러서 새 단축키를 등록하는 칸)
  capture:
    start: 눌러서 새 단축키 등록
    prompt: 새 단축키를 누르세요
    cancel_hint: Esc로 취소

